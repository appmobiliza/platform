packages:
  - "apps/*"
  - "packages/*"
  - "config/*"

overrides:
  lightningcss: 1.30.1
  esbuild: ^0.28.0
  react: 19.2.3
  react-dom: 19.2.3

nodeLinker: hoisted

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: true
  sharp: true

minimumReleaseAgeExclude:
  - '@expo/cli@56.1.16'
  - '@expo/config-plugins@56.0.9'
  - '@expo/config-types@56.0.6'
  - '@expo/inline-modules@0.0.12'
  - '@expo/prebuild-config@56.0.16'
  - expo-font@56.0.7
  - expo-modules-autolinking@56.0.16
  - expo-modules-core@56.0.17
  - expo-modules-jsi@56.0.10
  - expo@56.0.12
  - '@expo/ui@56.0.18'
  - expo-location@56.0.18
  - expo-notifications@56.0.18
  - expo-router@56.2.11
